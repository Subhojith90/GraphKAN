campaign:
  name: stage4f1_transactional_scheduler_repair
  schema_version: stage4f-native-v1
  output_root: results_stage4f1/transactional_campaign
  legacy_stage4f_open_metrics: results_stage4f/boundary_patch/open/raw/stage4e_metrics.csv
  legacy_note: Preserve old Stage 4F triage data as immutable legacy evidence. New outputs use stage4f-native-v1.

physics:
  n_sites: 10
  omega: 1.0
  deltas: ["1.25", "1.50", "1.75", "2.00"]
  c6_values: ["3", "4", "5"]
  boundaries: ["open", "periodic"]
  seeds: [0, 1, 2, 3, 4]
  samples: 4096
  sr_shift: 0.1

models:
  rbf_radial_b32:
    lane: core
  endpoint_sum_b32:
    lane: core
  endpoint_product_b32:
    lane: core
  endpoint_hybrid_b32:
    lane: core
  endpoint_full_b32:
    lane: core
  mlp_endpoint_medium:
    lane: core
  mlp_endpoint_large:
    lane: core
  rbm_h32:
    lane: control

base_configs:
  open: configs/netket_stage4f_boundary_patch_open.yaml
  periodic: configs/netket_stage4f_boundary_patch_periodic.yaml

completion_requirements:
  require_metrics: true
  require_checkpoint: true
  require_site_observables: true
  require_corr_observables: true
  require_history: true
  expected_history_points: 14
  require_exitcode_zero: true
  require_complete_json_last: true

timeouts:
  heartbeat_seconds: 15
  warn_after_seconds_without_heartbeat: 120
  graceful_kill_after_seconds_without_heartbeat: 300
  hard_kill_grace_seconds: 30
  absolute_non_rbm_seed_seconds: 480
  absolute_rbm_seed_seconds: 720
