name: Stage 4G final calibration and N12 confirmation

on:
  workflow_dispatch:
    inputs:
      accepted_g2d_run_id:
        description: "Run ID containing the accepted stage4g-convergence-g2d-closure-* artifact"
        required: true
        type: string

permissions: {contents: read, actions: read}
concurrency: {group: "stage4g-final-${{ github.repository }}", cancel-in-progress: false}
env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.7", cache: pip, cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt}
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - name: Verify repository and freeze final resume
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash verify_repository.sh
          python scripts/stage4g_final_protocol.py validate
          python scripts/stage4g_final_protocol.py freeze --output results_stage4g/protocol
          python scripts/stage4g_final_protocol.py verify-freeze --output results_stage4g/protocol
      - name: Download accepted G2d convergence closure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage4g-convergence-g2d-closure-*
          path: results_stage4g/accepted_g2d
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.accepted_g2d_run_id }}
      - name: Attest accepted G2d and N12 periodic aliases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('results_stage4g/accepted_g2d/convergence_g2d/convergence_g2d_gate.json').read_text())
          assert g['schema_version']=='stage4g-g2d-stabilization-gate-v1'
          assert g['validation']=='PASS' and g['composite_group_passes']==72
          assert g['checkpoint_attestations']==20 and g['periodic_alias_passes']==30
          PY
          python scripts/validate_stage4g_periodic_alias.py --n-sites 12 \
            --output results_stage4g/environment/n12_periodic_alias_gate.json
          git rev-parse HEAD > results_stage4g/environment/git_commit.txt
          printf '%s\n' "${{ inputs.accepted_g2d_run_id }}" > results_stage4g/environment/accepted_g2d_run_id.txt
          python -m pip freeze --all > results_stage4g/environment/pip_freeze.txt
      - name: Upload final-resume preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: stage4g-final-preflight, path: results_stage4g, if-no-files-found: error, retention-days: 90}

  calibration:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        boundary: [open, periodic]
        model: [mlp_b10_h5, mlp_b12_h7, mlp_b14_h9, rbm_h16, rbm_h32, rbm_h48]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.7", cache: pip, cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt}
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-final-preflight, path: results_stage4g}
      - name: Run isolated control-calibration shard
        run: |
          python scripts/stage4g_final_protocol.py verify-freeze --output results_stage4g/protocol
          timeout --signal=TERM 230m python -u scripts/run_stage4g.py \
            --config "results_stage4g/protocol/runner_configs/calibration_${{ matrix.boundary }}.yaml" \
            --only-models "${{ matrix.model }}" \
            --output-root "results_stage4g/shards/calibration/${{ matrix.boundary }}/${{ matrix.model }}"
      - name: Upload calibration shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-calibration-${{ matrix.boundary }}-${{ matrix.model }}-final
          path: results_stage4g/shards/calibration/${{ matrix.boundary }}/${{ matrix.model }}
          if-no-files-found: error
          retention-days: 90

  select_controls:
    needs: calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs: {matrix: "${{ steps.matrix.outputs.value }}"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.7", cache: pip, cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt}
      - name: Install hash-pinned analysis environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-final-preflight, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: "stage4g-calibration-*-final", path: downloaded}
      - name: Merge calibration and freeze selected controls
        run: |
          python scripts/stage4g_merge_shards.py --input downloaded --phase calibration
          python scripts/stage4g_protocol.py select-controls --output results_stage4g/protocol \
            --metrics results_stage4g/calibration/open/raw/stage4g_metrics.csv results_stage4g/calibration/periodic/raw/stage4g_metrics.csv
      - name: Build confirmation matrix
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          s=json.loads(Path('results_stage4g/protocol/control_selection.json').read_text())['selected']
          models=['rbf_radial_b32','endpoint_full_b32','endpoint_hybrid_b32','nongeometric_b32_p3',s['mlp'],s['rbm']]
          print('value='+json.dumps({'include':[{'boundary':b,'model':m} for b in ['open','periodic'] for m in models]},separators=(',',':')))
          PY
      - name: Upload calibration and frozen selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-final-control-selection
          path: |
            results_stage4g/protocol
            results_stage4g/calibration
          if-no-files-found: error
          retention-days: 90

  confirmation:
    needs: select_controls
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select_controls.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.7", cache: pip, cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt}
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-final-control-selection, path: results_stage4g}
      - name: Run isolated N12 confirmation shard
        run: |
          python scripts/stage4g_final_protocol.py verify-freeze --output results_stage4g/protocol
          timeout --signal=TERM 410m python -u scripts/run_stage4g.py \
            --config "results_stage4g/protocol/runner_configs/confirmation_${{ matrix.boundary }}.yaml" \
            --only-models "${{ matrix.model }}" \
            --output-root "results_stage4g/shards/confirmation/${{ matrix.boundary }}/${{ matrix.model }}"
      - name: Upload confirmation shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-confirmation-${{ matrix.boundary }}-${{ matrix.model }}-final
          path: results_stage4g/shards/confirmation/${{ matrix.boundary }}/${{ matrix.model }}
          if-no-files-found: error
          retention-days: 90

  final_gate:
    needs: [preflight, select_controls, confirmation]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.7", cache: pip, cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt}
      - name: Install hash-pinned analysis environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-final-preflight, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-final-control-selection, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: "stage4g-confirmation-*-final", path: downloaded}
      - name: Merge N12 campaign and evaluate amended final gate
        id: gate
        continue-on-error: true
        run: |
          python scripts/stage4g_final_protocol.py verify-freeze --output results_stage4g/protocol
          python scripts/stage4g_merge_shards.py --input downloaded --phase confirmation
          python scripts/analyze_stage4g_g2d_final.py --results results_stage4g \
            --accepted-g2d results_stage4g/accepted_g2d \
            --periodic-alias results_stage4g/environment/n12_periodic_alias_gate.json
      - name: Upload complete Stage 4G evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "stage4g-complete-evidence-${{ github.run_id }}", path: results_stage4g, if-no-files-found: error, retention-days: 90}
      - name: Publish final Stage 4G decision
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('results_stage4g/analysis/stage4g_final_decision.json')
          if not p.is_file(): print('## Stage 4G final gate\n\nNo decision produced.'); raise SystemExit(0)
          g=json.loads(p.read_text()); print(f"## {g['decision_class']}\n")
          print(f"- Accepted convergence: {g['accepted_g2d_composite_passes']}/72")
          print(f"- N12 exact health: {g['confirmation_exact_health_passes']}/180")
          print(f"- Endpoint-full open cells: {g['endpoint_full_open_cells_passed']}/3")
          print(f"- Endpoint-hybrid diagnostic cells: {g['endpoint_hybrid_open_cells_passed']}/3")
          print(f"- N12 periodic alias proof: {g['periodic_alias_passes']}/30")
          print(f"\n{g['scientific_decision']}")
          if g['blocking_errors']:
              print('\n### Blocking decisions'); [print(f'- {x}') for x in g['blocking_errors']]
          PY
      - name: Enforce final Stage 4G decision
        if: ${{ always() && steps.gate.outcome != 'success' }}
        run: exit 1
