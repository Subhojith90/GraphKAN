name: Stage 4G G2c targeted convergence recovery

on:
  workflow_dispatch:
    inputs:
      g2b_gate_run_id:
        description: "Run ID containing the preserved stage4g-convergence-g2b-merged artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: stage4g-g2c-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - name: Verify repository and freeze G2c before execution
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash verify_repository.sh
          python scripts/stage4g_g2c_protocol.py validate
          python scripts/stage4g_g2c_protocol.py freeze --output results_stage4g/g2c_protocol
          python scripts/stage4g_g2c_protocol.py verify-freeze --output results_stage4g/g2c_protocol
      - name: Download and preserve the failed G2b decision
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stage4g-convergence-g2b-merged
          path: results_stage4g/predecessor_g2b
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.g2b_gate_run_id }}
      - name: Attest the G2b failure and verify periodic aliases exactly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results_stage4g/predecessor_g2b/convergence_g2b_gate.json')
          gate=json.loads(p.read_text())
          assert gate['schema_version']=='stage4g-g2b-convergence-gate-v1'
          assert gate['validation']=='FAIL' and gate['runs']==120 and gate['group_passes']==67
          PY
          printf '%s\n' "${{ inputs.g2b_gate_run_id }}" > results_stage4g/predecessor_g2b/github_run_id.txt
          python scripts/validate_stage4g_periodic_alias.py \
            --output results_stage4g/g2c_protocol/periodic_alias_gate.json
      - name: Upload frozen G2c preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-g2c-preflight
          path: results_stage4g
          if-no-files-found: error
          retention-days: 90

  convergence_g2c:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {tag: radial-d2p00-c5, boundary: open, model: rbf_radial_b32, delta: "2.00", c6: "5"}
          - {tag: full-d2p00-c5, boundary: open, model: endpoint_full_b32, delta: "2.00", c6: "5"}
          - {tag: mlp-d2p00-c5, boundary: open, model: mlp_b12_h7, delta: "2.00", c6: "5"}
          - {tag: mlp-d1p25-c3, boundary: periodic, model: mlp_b12_h7, delta: "1.25", c6: "3"}
          - {tag: mlp-d1p50-c4, boundary: periodic, model: mlp_b12_h7, delta: "1.50", c6: "4"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-g2c-preflight, path: results_stage4g}
      - name: Execute fresh 7000-step low-learning-rate target
        run: |
          python scripts/stage4g_g2c_protocol.py verify-freeze --output results_stage4g/g2c_protocol
          timeout --signal=TERM 710m python -u scripts/run_stage4g.py \
            --config "results_stage4g/g2c_protocol/runner_configs/convergence_g2c_${{ matrix.boundary }}.yaml" \
            --only-models "${{ matrix.model }}" \
            --only-deltas "${{ matrix.delta }}" \
            --only-c6 "${{ matrix.c6 }}" \
            --output-root "results_stage4g/shards/convergence_g2c/${{ matrix.boundary }}/${{ matrix.model }}/${{ matrix.tag }}"
      - name: Upload G2c target shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-convergence_g2c-${{ matrix.boundary }}-${{ matrix.model }}-${{ matrix.tag }}
          path: results_stage4g/shards/convergence_g2c/${{ matrix.boundary }}/${{ matrix.model }}/${{ matrix.tag }}
          if-no-files-found: error
          retention-days: 90

  convergence_g2c_gate:
    needs: [preflight, convergence_g2c]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned analysis environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-g2c-preflight, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage4g-convergence_g2c-*
          path: downloaded
      - name: Merge the five targets and evaluate G2c
        id: gate
        continue-on-error: true
        run: |
          python scripts/stage4g_g2c_protocol.py verify-freeze --output results_stage4g/g2c_protocol
          python scripts/stage4g_merge_shards.py --input downloaded --phase convergence_g2c
          python scripts/validate_stage4g_g2c.py \
            --g2b results_stage4g/predecessor_g2b \
            --g2c results_stage4g/convergence_g2c \
            --periodic-alias results_stage4g/g2c_protocol/periodic_alias_gate.json
      - name: Upload complete G2c recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-convergence-g2c-closure-${{ github.run_id }}
          path: results_stage4g
          if-no-files-found: error
          retention-days: 90
      - name: Publish G2c decision
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('results_stage4g/convergence_g2c/convergence_g2c_gate.json')
          if not p.is_file():
              print('## Stage 4G G2c\n\nNo decision record was produced.'); raise SystemExit(0)
          g=json.loads(p.read_text())
          print(f"## Stage 4G G2c: {g['decision_class']}\n")
          print(f"- Target exact health: {g['target_exact_health_passes']}/25")
          print(f"- Target convergence: {g['target_group_passes']}/15")
          print(f"- Composite convergence: {g['composite_group_passes']}/72")
          print(f"- Endpoint-full open cells: {g['endpoint_full_open_cells_passed']}/3")
          print(f"- Periodic same-parameter invariance: {g['periodic_alias_passes']}/30")
          print(f"- Endpoint-hybrid: {g['endpoint_hybrid_status']}")
          if g['blocking_errors']:
              print('\n### Blocking decisions')
              for item in g['blocking_errors']: print(f'- {item}')
          PY
      - name: Enforce the G2c recovery decision
        if: ${{ always() && steps.gate.outcome != 'success' }}
        run: exit 1
