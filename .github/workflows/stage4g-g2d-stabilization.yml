name: Stage 4G G2d checkpoint stabilization tail

on:
  workflow_dispatch:
    inputs:
      g2c_closure_run_id:
        description: "Run ID containing stage4g-convergence-g2c-closure-*"
        required: true
        type: string

permissions: {contents: read, actions: read}
concurrency: {group: "stage4g-g2d-${{ github.repository }}", cancel-in-progress: false}
env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.7", cache: pip, cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt}
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - name: Verify and freeze G2d
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash verify_repository.sh
          python scripts/stage4g_g2d_protocol.py validate
          python scripts/stage4g_g2d_protocol.py freeze --output results_stage4g/g2d_protocol
          python scripts/stage4g_g2d_protocol.py verify-freeze --output results_stage4g/g2d_protocol
      - name: Download preserved G2c closure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage4g-convergence-g2c-closure-*
          path: results_stage4g/predecessor_g2c
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.g2c_closure_run_id }}
      - name: Attest G2c identity and checkpoint inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results_stage4g/predecessor_g2c/convergence_g2c/convergence_g2c_gate.json')
          g=json.loads(p.read_text())
          assert g['schema_version']=='stage4g-g2c-recovery-gate-v1'
          assert g['validation']=='FAIL' and g['target_runs']==25 and g['target_group_passes']==10
          checkpoints=list(Path('results_stage4g/predecessor_g2c/convergence_g2c').rglob('*.npz'))
          assert len(checkpoints)==25, len(checkpoints)
          PY
          printf '%s\n' "${{ inputs.g2c_closure_run_id }}" > results_stage4g/predecessor_g2c/github_run_id.txt
      - name: Upload frozen G2d preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: stage4g-g2d-preflight, path: results_stage4g, if-no-files-found: error, retention-days: 90}

  convergence_g2d:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {tag: radial-d2p00-c5, boundary: open, model: rbf_radial_b32, delta: "2.00", c6: "5"}
          - {tag: full-d2p00-c5, boundary: open, model: endpoint_full_b32, delta: "2.00", c6: "5"}
          - {tag: mlp-d2p00-c5, boundary: open, model: mlp_b12_h7, delta: "2.00", c6: "5"}
          - {tag: mlp-d1p25-c3, boundary: periodic, model: mlp_b12_h7, delta: "1.25", c6: "3"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.7", cache: pip, cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt}
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-g2d-preflight, path: results_stage4g}
      - name: Continue exact G2c parameters through the stabilization tail
        run: |
          python scripts/stage4g_g2d_protocol.py verify-freeze --output results_stage4g/g2d_protocol
          timeout --signal=TERM 470m python -u scripts/run_stage4g.py \
            --config "results_stage4g/g2d_protocol/runner_configs/convergence_g2d_${{ matrix.boundary }}.yaml" \
            --only-models "${{ matrix.model }}" --only-deltas "${{ matrix.delta }}" --only-c6 "${{ matrix.c6 }}" \
            --initial-checkpoint-root results_stage4g/predecessor_g2c/convergence_g2c \
            --output-root "results_stage4g/shards/convergence_g2d/${{ matrix.boundary }}/${{ matrix.model }}/${{ matrix.tag }}"
      - name: Upload G2d tail shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-convergence_g2d-${{ matrix.boundary }}-${{ matrix.model }}-${{ matrix.tag }}
          path: results_stage4g/shards/convergence_g2d/${{ matrix.boundary }}/${{ matrix.model }}/${{ matrix.tag }}
          if-no-files-found: error
          retention-days: 90

  convergence_g2d_gate:
    needs: [preflight, convergence_g2d]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12.7", cache: pip, cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt}
      - name: Install hash-pinned analysis environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-g2d-preflight, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: "stage4g-convergence_g2d-*", path: downloaded}
      - name: Merge and evaluate the G2d composite
        id: gate
        continue-on-error: true
        run: |
          python scripts/stage4g_g2d_protocol.py verify-freeze --output results_stage4g/g2d_protocol
          python scripts/stage4g_merge_shards.py --input downloaded --phase convergence_g2d
          python scripts/validate_stage4g_g2d.py --g2c-root results_stage4g/predecessor_g2c --g2d results_stage4g/convergence_g2d
      - name: Upload complete G2d closure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: "stage4g-convergence-g2d-closure-${{ github.run_id }}", path: results_stage4g, if-no-files-found: error, retention-days: 90}
      - name: Publish G2d decision
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('results_stage4g/convergence_g2d/convergence_g2d_gate.json')
          if not p.is_file(): print('## Stage 4G G2d\n\nNo decision produced.'); raise SystemExit(0)
          g=json.loads(p.read_text()); print(f"## Stage 4G G2d: {g['decision_class']}\n")
          print(f"- Checkpoint attestations: {g['checkpoint_attestations']}/20")
          print(f"- Exact health: {g['target_exact_health_passes']}/20")
          print(f"- Tail convergence: {g['target_group_passes']}/12")
          print(f"- Composite convergence: {g['composite_group_passes']}/72")
          print(f"- Endpoint-full open cells: {g['endpoint_full_open_cells_passed']}/3")
          print(f"- Periodic alias proof: {g['periodic_alias_passes']}/30")
          if g['blocking_errors']:
              print('\n### Blocking decisions'); [print(f'- {x}') for x in g['blocking_errors']]
          PY
      - name: Enforce G2d
        if: ${{ always() && steps.gate.outcome != 'success' }}
        run: exit 1
