name: Stage 4F-R.1 independent Linux replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked research environment
        run: python -m pip install -e '.[nqs]'
      - name: Record independent host and environment
        run: |
          mkdir -p results_stage4fr1/independent_replay/environment
          uname -a > results_stage4fr1/independent_replay/environment/uname.txt
          python -VV > results_stage4fr1/independent_replay/environment/python.txt
          python -m pip freeze > results_stage4fr1/independent_replay/environment/pip_freeze.txt
          git rev-parse HEAD > results_stage4fr1/independent_replay/environment/git_commit.txt
      - name: Verify supplied frozen campaign before replay
        run: ./verify_repository.sh
      - name: Initialize preregistered replay
        run: python scripts/stage4f1c_campaign.py init --config configs/stage4fr1_second_host_replay.yaml
      - name: Execute 12 core rows
        run: python -u scripts/stage4f1c_worker.py --config configs/stage4fr1_second_host_replay.yaml --lane core --worker-id github-linux-core-${{ github.run_id }} --real-run --max-runs 12
      - name: Execute 4 control rows
        run: python -u scripts/stage4f1c_worker.py --config configs/stage4fr1_second_host_replay.yaml --lane control --worker-id github-linux-control-${{ github.run_id }} --real-run --max-runs 4
      - name: Validate and compare replay
        run: |
          python scripts/stage4f1c_campaign.py validate --campaign results_stage4fr1/independent_replay --strict-integrity --reconcile-registry --require-terminal --require-complete
          python scripts/compare_stage4fr1_replay.py
      - name: Upload immutable replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4fr1-independent-linux-replay-${{ github.run_id }}
          path: results_stage4fr1/independent_replay
          if-no-files-found: error
          retention-days: 90

