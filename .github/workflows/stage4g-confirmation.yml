name: Stage 4G finite-size and gauge-fixed confirmation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage4g-confirmation-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/scripts
  PYTHONUNBUFFERED: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  STAGE4G_CONFIG: configs/stage4g_frozen.yaml

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable dispatch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python 3.12.7
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - name: Attest commit and verify frozen Stage 4F evidence
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash verify_repository.sh
      - name: Freeze and verify Stage 4G protocol
        run: |
          python scripts/stage4g_protocol.py validate
          python scripts/stage4g_protocol.py freeze --output results_stage4g/protocol
          python scripts/stage4g_protocol.py verify-freeze --output results_stage4g/protocol
      - name: Execute formal gauge and integration smoke gates
        run: |
          python scripts/stage4g_gauge.py
          python -u scripts/run_stage4g.py --config configs/stage4g_smoke_open.yaml --overwrite
          python -u scripts/run_stage4g.py --config configs/stage4g_smoke_periodic.yaml --overwrite
          python scripts/validate_stage4g_smoke.py
      - name: Record immutable Actions provenance
        run: |
          mkdir -p results_stage4g/environment
          git rev-parse HEAD > results_stage4g/environment/git_commit.txt
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > results_stage4g/environment/github_run_url.txt
          python -m pip freeze --all > results_stage4g/environment/pip_freeze.txt
      - name: Upload preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-preflight
          path: results_stage4g
          if-no-files-found: error
          retention-days: 90

  convergence:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        boundary: [open, periodic]
        model: [rbf_radial_b32, endpoint_full_b32, endpoint_hybrid_b32, mlp_b12_h7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - name: Download frozen protocol
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-preflight, path: results_stage4g}
      - name: Verify protocol and run isolated convergence shard
        run: |
          python scripts/stage4g_protocol.py verify-freeze --output results_stage4g/protocol
          timeout --signal=TERM 320m python -u scripts/run_stage4g.py \
            --config "results_stage4g/protocol/runner_configs/convergence_${{ matrix.boundary }}.yaml" \
            --only-models "${{ matrix.model }}" \
            --output-root "results_stage4g/shards/convergence/${{ matrix.boundary }}/${{ matrix.model }}"
      - name: Upload convergence shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-convergence-${{ matrix.boundary }}-${{ matrix.model }}
          path: results_stage4g/shards/convergence/${{ matrix.boundary }}/${{ matrix.model }}
          if-no-files-found: error
          retention-days: 90

  convergence_gate:
    needs: convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned analysis environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-preflight, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage4g-convergence-*
          path: downloaded
      - name: Merge all shards and enforce convergence gate
        run: |
          python scripts/stage4g_merge_shards.py --input downloaded --phase convergence
          python scripts/validate_stage4g_convergence.py
      - name: Upload merged convergence evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-convergence-merged
          path: results_stage4g/convergence
          if-no-files-found: error
          retention-days: 90

  calibration:
    needs: convergence_gate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        boundary: [open, periodic]
        model: [mlp_b10_h5, mlp_b12_h7, mlp_b14_h9, rbm_h16, rbm_h32, rbm_h48]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-preflight, path: results_stage4g}
      - name: Run isolated calibration shard
        run: |
          python scripts/stage4g_protocol.py verify-freeze --output results_stage4g/protocol
          timeout --signal=TERM 230m python -u scripts/run_stage4g.py \
            --config "results_stage4g/protocol/runner_configs/calibration_${{ matrix.boundary }}.yaml" \
            --only-models "${{ matrix.model }}" \
            --output-root "results_stage4g/shards/calibration/${{ matrix.boundary }}/${{ matrix.model }}"
      - name: Upload calibration shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-calibration-${{ matrix.boundary }}-${{ matrix.model }}
          path: results_stage4g/shards/calibration/${{ matrix.boundary }}/${{ matrix.model }}
          if-no-files-found: error
          retention-days: 90

  select_controls:
    needs: calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned analysis environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-preflight, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage4g-calibration-*
          path: downloaded
      - name: Merge calibration and freeze controls
        run: |
          python scripts/stage4g_merge_shards.py --input downloaded --phase calibration
          python scripts/stage4g_protocol.py select-controls \
            --output results_stage4g/protocol \
            --metrics results_stage4g/calibration/open/raw/stage4g_metrics.csv results_stage4g/calibration/periodic/raw/stage4g_metrics.csv
      - name: Build confirmation matrix from frozen selection
        id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          selected=json.loads(Path('results_stage4g/protocol/control_selection.json').read_text())['selected']
          models=['rbf_radial_b32','endpoint_full_b32','endpoint_hybrid_b32','nongeometric_b32_p3',selected['mlp'],selected['rbm']]
          print('value='+json.dumps({'include':[{'boundary':b,'model':m} for b in ['open','periodic'] for m in models]},separators=(',',':')))
          PY
      - name: Upload frozen control selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-control-selection
          path: |
            results_stage4g/protocol
            results_stage4g/calibration
          if-no-files-found: error
          retention-days: 90

  confirmation:
    needs: select_controls
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select_controls.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned NQS environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-control-selection, path: results_stage4g}
      - name: Run isolated N=12 confirmation shard
        run: |
          python scripts/stage4g_protocol.py verify-freeze --output results_stage4g/protocol
          timeout --signal=TERM 340m python -u scripts/run_stage4g.py \
            --config "results_stage4g/protocol/runner_configs/confirmation_${{ matrix.boundary }}.yaml" \
            --only-models "${{ matrix.model }}" \
            --output-root "results_stage4g/shards/confirmation/${{ matrix.boundary }}/${{ matrix.model }}"
      - name: Upload confirmation shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-confirmation-${{ matrix.boundary }}-${{ matrix.model }}
          path: results_stage4g/shards/confirmation/${{ matrix.boundary }}/${{ matrix.model }}
          if-no-files-found: error
          retention-days: 90

  final_gate:
    needs: confirmation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {ref: "${{ github.sha }}", persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements/stage4fr1b-linux-py312.lock.txt
      - name: Install hash-pinned analysis environment
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes -r requirements/stage4fr1b-linux-py312.lock.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-preflight, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-convergence-merged, path: results_stage4g/convergence}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: stage4g-control-selection, path: results_stage4g}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage4g-confirmation-*
          path: downloaded
      - name: Merge confirmation and evaluate all final gates
        run: |
          python scripts/stage4g_protocol.py verify-freeze --output results_stage4g/protocol
          python scripts/stage4g_merge_shards.py --input downloaded --phase confirmation
          python scripts/analyze_stage4g.py
          printf '%s\n' "$GITHUB_RUN_ID" > results_stage4g/environment/github_run_id.txt
      - name: Upload complete Stage 4G evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage4g-complete-evidence-${{ github.run_id }}
          path: results_stage4g
          if-no-files-found: error
          retention-days: 90
      - name: Record final artifact identity
        if: always()
        run: |
          echo "Artifact digest: ${{ steps.evidence.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact URL: ${{ steps.evidence.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
