  grad_clip_norm: 5.0
  n_basis: 8
  hidden: 12
model_overrides:
  product:
    learning_rate: 0.002
    diag_shift: 0.05
  rbm:
    learning_rate: 0.003
    diag_shift: 0.03
    hidden: 12
  smooth_jastrow:
    learning_rate: 0.002
    diag_shift: 0.05
  mlp_pair:
    learning_rate: 0.001
    diag_shift: 0.1
    grad_clip_norm: 2.0
  kan_jastrow:
    learning_rate: 0.001
    diag_shift: 0.1
    grad_clip_norm: 2.0
health_gate:
  min_energy_error: 1.0e-10
  min_energy_variance: 1.0e-12
  min_unique_states: 2
  min_unique_state_fraction: 0.005
  max_abs_energy_error_to_ed: 0.5
fairness:
  rule: Stage 2.5 is a known-good phase-aware validation gate. No cross-architecture
