profile: netket_stage2_5_phase_aware_ed_gate
output_root: results_stage2_5
models:
- product
- rbm
- smooth_jastrow
- mlp_pair
- kan_jastrow
chains:
  n_sites:
  - 6
  spacing: 1.0
parameters:
  omega:
  - 1.0
  delta:
  - 1.0
  c6:
  - 1.0
  sign_rule: parity
training:
  seeds:
  - 0
  - 1
  - 2
