  endpoint_product_19p: {kind: kan_endpoint_product_jastrow, basis_family: sine, n_basis: 12, hidden: 1}
  endpoint_full_19p: {kind: kan_endpoint_jastrow, basis_family: sine, n_basis: 10, hidden: 1}
health_gate:
  min_energy_error: 1.0e-10
  min_unique_state_fraction: 0.005
  max_abs_energy_error_to_ed: 0.5
  max_density_mae_to_ed: 0.08
  max_connected_correlation_mae_to_ed: 0.08
notes: "Blocked until Stage 3B.1 sine-taxonomy replay passes. Six endpoint-feature ablations, two seeds each; 12 runs total."
